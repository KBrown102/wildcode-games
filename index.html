<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WILD CODE · 野码实验场</title>
<link rel="icon" href="favicon.png?v=3">
<style>
  :root{
    --bg:#0c0d12; --panel:#14161e; --panel2:#1b1e29; --ink:#d8d2c6; --mut:#8b867b;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --accent:#FF6A3D; --fav:#ff7d8e; --ok:#7ee0a8;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--bg);color:var(--ink);
    font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{min-height:100vh;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(120,140,170,.10), transparent 60%),
      radial-gradient(900px 500px at 90% 100%, rgba(190,150,120,.06), transparent 60%),
      var(--bg);}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;cursor:pointer;color:inherit;}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);
    border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;}
  input:focus,textarea:focus{border-color:var(--accent);}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;}

  /* ---------- 顶栏 ---------- */
  #topbar{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
    background:rgba(12,13,18,.82);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:12px 22px;}
  #logo{font-weight:200;font-size:18px;letter-spacing:3px;cursor:pointer;white-space:nowrap;}
  #logo b{color:var(--accent);font-weight:400;}
  #search{flex:1;max-width:360px;margin-left:8px;}
  #search input{width:100%;}
  .spacer{flex:1;}
  .tbtn{background:transparent;border:1px solid var(--line2);border-radius:999px;
    padding:7px 15px;font-size:13px;letter-spacing:1px;transition:all .2s;white-space:nowrap;}
  .tbtn:hover{border-color:var(--accent);color:var(--accent);}
  /* 语言切换按钮：显示"下一个语言"的代码，点一下切过去 */
  .tbtn.lang{min-width:54px;text-align:center;font-size:12px;letter-spacing:2px;
    color:var(--accent);border-color:rgba(255,106,61,.35);padding:7px 12px;}
  .tbtn.lang:hover{background:rgba(255,106,61,.1);}
  .tbtn.primary{background:var(--accent);color:#06222b;border-color:var(--accent);font-weight:600;}
  .tbtn.primary:hover{filter:brightness(1.08);color:#06222b;}
  #avatarBtn{display:flex;align-items:center;gap:8px;background:var(--panel2);
    border:1px solid var(--line2);border-radius:999px;padding:5px 12px 5px 6px;}
  #avatarBtn:hover{border-color:var(--accent);}
  .av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:16px;background:rgba(255,255,255,.08);}
  .av.lg{width:72px;height:72px;font-size:34px;}
  .who{font-size:13px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- 通用容器 ---------- */
  #view{padding:0 0 90px;}
  .wrap{max-width:1460px;margin:0 auto;padding:0 26px;}

  /* ---------- 主导航 ---------- */
  #mainnav{display:flex;gap:2px;margin-left:4px;}
  #mainnav .nv{font-size:13px;letter-spacing:1px;color:var(--mut);padding:8px 13px;
    border-radius:10px;transition:all .2s;white-space:nowrap;cursor:pointer;}
  #mainnav .nv:hover{color:var(--ink);background:rgba(255,255,255,.05);}
  #mainnav .nv.on{color:var(--accent);background:rgba(255,106,61,.1);}
  #search{width:240px;}
  #search input{width:100%;padding:8px 14px;font-size:13px;border-radius:999px;
    background:rgba(255,255,255,.05);border-color:transparent;}
  #search input:focus{background:rgba(255,255,255,.08);border-color:var(--accent);}

  /* ---------- 语言菜单 ---------- */
  #langWrap{position:relative;}
  #langMenu{position:absolute;right:0;top:calc(100% + 8px);z-index:80;min-width:158px;
    background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:6px;
    box-shadow:0 18px 44px rgba(0,0,0,.6);}
  #langMenu .litem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    cursor:pointer;font-size:13px;transition:background .15s;}
  #langMenu .litem:hover{background:var(--panel2);}
  #langMenu .litem .lc{width:30px;font-size:10px;letter-spacing:1px;color:var(--mut);}
  #langMenu .litem.on{color:var(--accent);}
  #langMenu .litem.on .lc{color:var(--accent);}
  #langMenu .litem .ck{margin-left:auto;font-size:11px;color:var(--accent);}

  /* ---------- Hero 轮播 ---------- */
  .carousel{position:relative;height:clamp(300px,32vw,420px);margin:20px 0 4px;
    border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#08090e;}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .75s ease;pointer-events:none;
    display:grid;grid-template-columns:1fr minmax(0,44%);align-items:center;}
  .slide.on{opacity:1;pointer-events:auto;}
  /* 全铺虚化底图：只做氛围，不跟文字抢注意力 */
  .slide .bg{position:absolute;inset:-10%;background-size:cover;background-position:center;
    filter:blur(34px) brightness(.34) saturate(.8);opacity:.85;}
  .slide .veil{position:absolute;inset:0;
    background:linear-gradient(100deg,rgba(8,9,14,.94) 0%,rgba(8,9,14,.8) 42%,rgba(8,9,14,.55) 72%,rgba(8,9,14,.35) 100%);}
  .slide .txt{position:relative;z-index:2;display:flex;flex-direction:column;gap:14px;
    padding:clamp(24px,3.4vw,52px);max-width:min(600px,100%);}
  .slide .kick{font-size:10px;letter-spacing:4px;color:var(--accent);text-transform:uppercase;}
  .slide h2{font-size:clamp(23px,2.9vw,38px);font-weight:300;letter-spacing:2px;line-height:1.16;}
  .slide .desc{color:rgba(216,210,198,.72);font-size:13px;line-height:1.75;max-width:44ch;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .slide .acts{display:flex;gap:10px;align-items:center;margin-top:4px;flex-wrap:wrap;}
  .slide .tags{display:flex;gap:7px;flex-wrap:wrap;}
  .slide .tags i{font-style:normal;font-size:10px;letter-spacing:1px;color:rgba(216,210,198,.72);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 9px;}
  /* 右侧清晰预览卡 */
  .slide .shot{position:relative;z-index:2;margin-right:clamp(18px,3vw,50px);aspect-ratio:16/10;
    border-radius:16px;background-size:cover;background-position:center;
    border:1px solid rgba(255,255,255,.16);box-shadow:0 30px 70px rgba(0,0,0,.62);
    transform:rotate(-1.2deg);transition:transform .5s;}
  .slide.on .shot{transform:rotate(-1.2deg) translateY(-3px);}
  .btn-play{background:var(--accent);color:#06222b;border:0;border-radius:999px;
    padding:11px 26px;font-size:14px;font-weight:600;letter-spacing:1px;transition:transform .2s,filter .2s;}
  .btn-play:hover{filter:brightness(1.1);transform:translateY(-1px);}
  .btn-ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line2);
    border-radius:999px;padding:11px 20px;font-size:13px;letter-spacing:1px;transition:all .2s;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .dots{position:absolute;left:clamp(24px,3.4vw,52px);bottom:18px;z-index:6;display:flex;gap:7px;}
  .dots i{width:20px;height:3px;border-radius:2px;background:rgba(255,255,255,.26);
    cursor:pointer;transition:all .3s;}
  .dots i.on{background:var(--accent);width:32px;}

  /* ---------- 分区 / 横向滚动 ---------- */
  .sect{margin:34px 0 0;}
  .sect-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px;}
  .sect-head h2{font-size:18px;font-weight:400;letter-spacing:2px;}
  .sect-head .more{font-size:12px;color:var(--mut);letter-spacing:1px;padding:6px 13px;
    border-radius:999px;border:1px solid var(--line2);cursor:pointer;transition:all .2s;
    background:transparent;white-space:nowrap;}
  .sect-head .more:hover{color:var(--accent);border-color:var(--accent);}
  /* 横向列表：不显示滑条，靠左右按钮整页翻动（rAF 缓动） */
  .railwrap{position:relative;}
  .rail{display:flex;gap:16px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;
    padding:2px 2px 4px;scrollbar-width:none;-ms-overflow-style:none;
    overscroll-behavior-x:contain;}
  .rail::-webkit-scrollbar{width:0;height:0;display:none;}
  .rail>*{scroll-snap-align:start;flex:0 0 auto;}
  .railbtn{position:absolute;top:calc(50% - 14px);transform:translateY(-50%);z-index:9;
    width:42px;height:42px;border-radius:50%;cursor:pointer;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.18);background:rgba(10,11,16,.82);
    backdrop-filter:blur(10px);color:var(--ink);font-size:15px;line-height:1;
    /* 常显淡态：藏起来用户会以为没有翻页功能 */
    opacity:.55;
    transition:opacity .28s,border-color .2s,color .2s,transform .2s,background .2s;}
  .railbtn svg{width:15px;height:15px;fill:currentColor;}
  .railwrap:hover .railbtn{opacity:1;}
  .railbtn:hover{border-color:var(--accent);color:var(--accent);
    background:rgba(18,20,28,.95);transform:translateY(-50%) scale(1.08);}
  .railbtn.prev{left:-19px;}
  .railbtn.next{right:-19px;}
  /* 到端 / 内容不足一屏：彻底不出现 */
  .railbtn.off{opacity:0!important;pointer-events:none!important;}
  .railwrap.nofit .railbtn{display:none;}

  /* ---------- 游戏卡片 ---------- */
  .gcard{position:relative;width:250px;cursor:pointer;}
  .gcard .art{position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;
    background-size:cover;background-position:center;border:1px solid var(--line);
    transition:transform .4s cubic-bezier(.22,1,.36,1),box-shadow .4s,border-color .35s;}
  /* hover 才淡入游戏内真实画面（默认是设计封面） */
  .gcard .pv{position:absolute;inset:0;z-index:1;background-size:cover;background-position:center;
    opacity:0;transform:scale(1.07);
    transition:opacity .42s ease,transform .62s cubic-bezier(.22,1,.36,1);}
  .gcard:hover .pv{opacity:1;transform:scale(1);}
  .gcard:hover .art{transform:translateY(-5px) scale(1.015);border-color:rgba(255,255,255,.24);
    box-shadow:0 20px 42px rgba(0,0,0,.55);}
  /* 默认只露一个玩法角标，其它信息 hover 才出 */
  .gcard .corner{position:absolute;top:9px;left:10px;z-index:2;font-size:10px;letter-spacing:1px;
    color:rgba(255,255,255,.86);background:rgba(8,9,14,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 9px;
    transition:opacity .25s;}
  .gcard .newb{position:absolute;top:9px;right:10px;z-index:2;font-size:9px;letter-spacing:1.5px;
    background:var(--accent);color:#06222b;border-radius:999px;padding:3px 8px;font-weight:600;}
  .gcard .hov{position:absolute;inset:0;z-index:3;opacity:0;transition:opacity .28s;
    background:linear-gradient(0deg,rgba(5,6,10,.94) 0%,rgba(5,6,10,.55) 46%,rgba(5,6,10,.1) 78%);
    display:flex;flex-direction:column;justify-content:flex-end;padding:12px;gap:7px;}
  .gcard:hover .hov{opacity:1;}
  .gcard .hov .hplay{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;
    background:rgba(255,255,255,.95);color:#0a0a0a;display:flex;align-items:center;justify-content:center;
    font-size:17px;transform:translate(-50%,-50%) scale(.82);transition:transform .3s;}
  .gcard:hover .hov .hplay{transform:translate(-50%,-50%) scale(1);}
  .gcard .hov .htags{display:flex;gap:5px;flex-wrap:wrap;font-size:10px;letter-spacing:.5px;
    color:rgba(255,255,255,.78);}
  .gcard .hov .htags i{font-style:normal;border:1px solid rgba(255,255,255,.18);
    border-radius:6px;padding:2px 6px;}
  .gcard .hov .hdate{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:1px;}
  .gcard .meta{padding:9px 2px 0;min-width:0;}
  .gcard .t{font-size:13.5px;letter-spacing:.6px;line-height:1.35;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;}
  .gcard .s{font-size:11px;color:var(--mut);margin-top:3px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;display:none;}
  .gcard .fav{position:absolute;right:8px;bottom:8px;z-index:4;width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1;
    background:rgba(0,0,0,.42);color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.14);
    opacity:0;transition:opacity .25s,transform .2s,color .25s;-webkit-tap-highlight-color:transparent;}
  .gcard:hover .fav{opacity:1;}
  .gcard .fav:hover{transform:scale(1.12);color:#fff;}
  .gcard .fav.on{opacity:1;color:var(--fav);background:rgba(255,125,142,.2);border-color:rgba(255,125,142,.45);}
  /* 变体：大卡 / 横向 / 纵向 */
  .gcard.big{width:360px;}
  .gcard.big .art{aspect-ratio:16/9;}
  .gcard.big .t{font-size:16px;}
  .gcard.big .s{display:block;}
  .gcard.wide{width:320px;}
  .gcard.wide .art{aspect-ratio:16/9;}
  .gcard.tall{width:180px;}
  .gcard.tall .art{aspect-ratio:3/4;}

  /* ---------- 分类入口网格 ---------- */
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px;}
  .catcard{position:relative;height:84px;border-radius:14px;overflow:hidden;cursor:pointer;
    background-size:cover;background-position:center;border:1px solid var(--line);
    display:flex;align-items:flex-end;padding:11px 13px;transition:transform .3s,border-color .3s;}
  .catcard:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.26);}
  .catcard::after{content:'';position:absolute;inset:0;
    background:linear-gradient(0deg,rgba(5,6,10,.94),rgba(5,6,10,.3));}
  .catcard span{position:relative;z-index:2;font-size:12.5px;letter-spacing:1px;}
  .catcard .cnum{position:absolute;top:9px;right:11px;z-index:2;font-size:10px;
    color:rgba(255,255,255,.55);letter-spacing:1px;}

  /* ---------- 浏览页 ---------- */
  .bhead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    margin:26px 0 6px;flex-wrap:wrap;}
  .bhead h1{font-size:26px;font-weight:300;letter-spacing:3px;}
  .bhead .bcnt{color:var(--mut);font-size:12px;letter-spacing:1px;padding-bottom:5px;}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:14px 0 0;}
  .chips{display:flex;gap:9px;flex-wrap:wrap;}
  .chip{font-size:12px;letter-spacing:1px;color:var(--mut);border:1px solid var(--line2);
    border-radius:999px;padding:7px 15px;transition:all .2s;background:transparent;}
  .chip:hover{color:var(--ink);}
  .chip.on{color:#06222b;background:var(--accent);border-color:var(--accent);font-weight:600;}
  .sortbox{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);
    letter-spacing:1px;white-space:nowrap;}
  .sortbox select{padding:7px 10px;cursor:pointer;}
  .vsw{display:flex;gap:3px;border:1px solid var(--line2);border-radius:10px;padding:3px;}
  .vsw button{background:transparent;border:0;padding:5px 10px;border-radius:7px;
    font-size:12px;color:var(--mut);transition:all .2s;}
  .vsw button.on{background:var(--panel2);color:var(--accent);}

  /* ---------- 动态标签筛选面板 ---------- */
  .tagpanel{margin:14px 0 20px;border:1px solid var(--line);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.022),transparent);padding:4px 14px 10px;}
  .tagpanel .thead{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 6px;}
  .tagpanel .thead .tt{font-size:11px;letter-spacing:2px;color:var(--mut);}
  .tagpanel .clr{font-size:11px;color:var(--mut);background:transparent;border:0;letter-spacing:1px;cursor:pointer;}
  .tagpanel .clr:hover{color:var(--accent);}
  .tagrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--line);}
  .tagrow .lbl{flex-shrink:0;width:40px;font-size:11px;letter-spacing:1px;color:var(--mut);padding-top:10px;}
  .tagrow .chips{gap:7px;}
  .chip.sm{font-size:11px;padding:5px 11px;}
  .chip .n{opacity:.45;margin-left:5px;font-size:10px;}
  .chip.on .n{opacity:.7;}

  /* ---------- 网格 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:22px 16px;}
  .grid .gcard{width:auto;}
  .grid.list{grid-template-columns:1fr;gap:0;}
  .grid.list .gcard{width:auto;display:flex;align-items:center;gap:14px;padding:9px;border-radius:14px;}
  .grid.list .gcard:hover{background:var(--panel);}
  .grid.list .gcard .art{width:168px;flex:0 0 168px;aspect-ratio:16/9;}
  .grid.list .gcard .meta{padding:0;flex:1;}
  .grid.list .gcard .t{font-size:15px;white-space:normal;}
  .grid.list .gcard .s{display:block;}
  .grid.list .gcard .fav{position:static;opacity:1;background:transparent;border:0;}
  .empty{text-align:center;color:var(--mut);font-size:13px;letter-spacing:1px;padding:60px 0;opacity:.7;}

  /* ---------- 游戏预览视图 ---------- */
  #view.game{padding:0;max-width:none;}
  .playbar{display:flex;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);
    background:rgba(12,13,18,.9);position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);}
  .playbar .back{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);
    border-radius:10px;padding:8px 14px;font-size:13px;transition:all .2s;}
  .playbar .back:hover{border-color:var(--accent);color:var(--accent);}
  .playbar .gtitle{font-size:16px;letter-spacing:2px;font-weight:300;}
  .playbar .gmeta{color:var(--mut);font-size:12px;}
  .playbar .spacer{flex:1;}
  .pbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:8px 14px;font-size:13px;transition:all .2s;}
  .pbtn:hover{border-color:var(--accent);color:var(--accent);}
  .pbtn.fav.on{color:var(--fav);border-color:rgba(255,125,142,.5);background:rgba(255,125,142,.08);}
  .stage{display:flex;align-items:flex-start;gap:0;min-height:calc(100vh - 120px);}
  .leftnav{width:210px;flex-shrink:0;padding:20px 14px;border-right:1px solid var(--line);
    position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;}
  .leftnav .ln-title{font-size:11px;letter-spacing:2px;color:var(--mut);margin:8px 6px 12px;}
  .leftnav a.ln{display:block;padding:9px 12px;border-radius:10px;color:var(--mut);font-size:13px;transition:all .2s;margin-bottom:4px;}
  .leftnav a.ln:hover{background:var(--panel);color:var(--ink);}
  .leftnav a.ln.active{background:var(--panel2);color:var(--accent);}
  .center{flex:1;min-width:0;padding:20px;display:flex;flex-direction:column;align-items:center;}
  .frame-title{font-size:21px;letter-spacing:3px;font-weight:300;text-align:center;color:var(--ink);margin-bottom:4px;}
  .frame-sub{font-size:12px;letter-spacing:1px;color:var(--mut);margin-bottom:16px;text-align:center;}
  .frame-wrap{width:100%;max-width:960px;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;
    border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;}
  .frame-wrap iframe{width:100%;height:100%;border:0;display:block;background:#000;}
  .fs-btn{position:absolute;right:12px;bottom:12px;z-index:5;background:rgba(0,0,0,.5);
    border:1px solid var(--line2);color:#fff;border-radius:10px;padding:8px 13px;font-size:13px;
    transition:all .2s;backdrop-filter:blur(4px);opacity:0;}
  .frame-wrap:hover .fs-btn{opacity:1;}
  .fs-btn:hover{border-color:var(--accent);color:var(--accent);}
  .frame-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);
    font-size:13px;letter-spacing:1px;background:#0a0b10;}
  .center .cmt{max-width:900px;width:100%;margin-top:22px;}
  .right{width:290px;flex-shrink:0;padding:20px 16px;border-left:1px solid var(--line);
    position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto;}

  .rec{display:flex;gap:11px;align-items:center;padding:9px;border-radius:12px;cursor:pointer;transition:background .2s;}

  /* ---------- 评论 ---------- */

  .cmt-list .ft{font-size:11px;color:var(--mut);margin-top:6px;display:flex;gap:14px;align-items:center;}
  .cmt-list .like{cursor:pointer;transition:color .2s;}
  .cmt-list .like:hover{color:var(--fav);}

  /* ---------- 个人主页 ---------- */
  .profile{max-width:760px;margin:0 auto;padding:30px 22px 0;}
  .pcard{display:flex;gap:20px;align-items:center;background:var(--panel);border:1px solid var(--line);

  .avpick{display:flex;gap:8px;flex-wrap:wrap;}
  .avpick .opt{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:19px;background:var(--panel2);border:1px solid var(--line2);cursor:pointer;transition:all .2s;}
  .avpick .opt.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,106,61,.3);}
  .list-item{display:flex;align-items:center;gap:12px;padding:11px;border-radius:12px;cursor:pointer;transition:background .2s;}

  .list-item .li-title{font-size:14px;}

      top:calc(50% - 20px);background:rgba(10,11,16,.72);}
    .railbtn.prev{left:2px;}

    .gcard{width:176px;}

    .sect-head h2{font-size:16px;}
    .catgrid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;}

    .grid.list .gcard .art{width:110px;flex:0 0 110px;}

  html[lang^="ja"] .tagrow .lbl{width:58px;letter-spacing:0;}

<script>
/* ============================ 数据 ============================ */
/* 只上架 S+A 级原型（40个） */
const WHITELIST = new Set([96,121,123,208,238,240,252,261,277,279,280,282,283,284,285,286,287,288,289,290,291,292,293,294,295,296,297,298,299,300,301,302,305,308,315,325,328,346,"card-slap","glass-marbles"]);
const GAMES = (window.GAMES_DATA || []).filter(g => WHITELIST.has(Number(g.n)) || WHITELIST.has(String(g.n)));

/* ============================ 国际化 ============================ */
/* 文案唯一来源是三张 CSV：
     i18n/strings.csv    站点文案（key,group,zh,en,note）
     i18n/taxonomy.csv   维度名 + 全部标签的中英对照
     i18n/games.csv      390 条游戏名 / 简介 / 设想
   改完执行：python i18n/build_i18n.py  → 生成 i18n-data.js。
   新增语言只需在 CSV 里加一列（如 ja），本文件不用改，切换按钮自动多一个语种。 */
const I18N = window.I18N || { langs:['zh'], default:'zh', ui:{}, tax:{}, games:{} };
const LANGS = (I18N.langs && I18N.langs.length) ? I18N.langs : ['zh'];
const LANG_SHORT = I18N.langShort || { zh:'中文', en:'EN' };
const LANG_NAME  = I18N.langName  || { zh:'中文', en:'English' };
let LANG = (function(){
  try{ const v=localStorage.getItem('dg:lang'); if(v && LANGS.indexOf(v)>=0) return v; }catch(e){}
  try{ const nav=(navigator.language||'zh').toLowerCase();
    if(nav.indexOf('zh')!==0 && LANGS.indexOf('en')>=0) return 'en'; }catch(e){}
  return I18N.default || LANGS[0];
})();
/* 取站点文案；缺译回退默认语言，再回退 key 本身。vars 支持 {name} 这类占位符 */
function T(key, vars){
  const cur=(I18N.ui[LANG]||{})[key];
  const def=(I18N.ui[I18N.default]||{})[key];
  let s = (cur!==undefined && cur!=='') ? cur : (def!==undefined ? def : '');
  if(!s) s = key;
  if(vars) for(const k in vars){ s = s.split('{'+k+'}').join(vars[k]); }
  return s;
}
/* 取标签译文（键格式 dim|中文值） */
function TX(dim, val){
  const k = dim+'|'+val;
  const cur=(I18N.tax[LANG]||{})[k];
  return (cur!==undefined && cur!=='') ? cur : val;
}
/* 游戏名译文：当前语言 → 中文（CSV 里已清洗掉混排英文）→ 数据原值。
   任何语言下卡片只显示一个名字，不会出现「中文 · English」。 */
function titleOf(g){
  const r=(I18N.games && I18N.games[g.file]) || null;
  const cur = r && r[LANG] && r[LANG].title;
  const zh  = r && r[I18N.default] && r[I18N.default].title;
  return cur || zh || g.title;
}
/* 一句话简介译文：当前语言 → 中文 → 数据兜底（games-data 只带标题，不带简介） */
function needOf(g){
  const r=(I18N.games && I18N.games[g.file]) || null;
  const cur = r && r[LANG] && r[LANG].need;
  const zh  = r && r[I18N.default] && r[I18N.default].need;
  return cur || zh || g.need || g.idea || '';
}
function catOf(g){ return TX('play', g.cat || '治愈休息'); }
function dimLabel(d){ return T('ui.dim.'+d.key) || d.label; }
/* 卡片/详情用的一行标签：每个维度取第一个，最多 maxDim 个 */
function tagLineOf(g, maxDim){
  const out=[], t=g.tags||{}, dims = maxDim ? TAG_DIMS.slice(0,maxDim) : TAG_DIMS;
  dims.forEach(d=>{ const arr=t[d.key]||[]; if(arr.length) out.push(TX(d.key, arr[0])); });
  return out.join(' · ');
}
function applyI18n(){
  const htmlLang = (I18N.langHtml && I18N.langHtml[LANG]) || (LANG==='zh' ? 'zh-CN' : LANG);
  document.documentElement.lang = htmlLang;
  document.title = T('ui.site.title');
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = T(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = T(el.getAttribute('data-i18n-html')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.setAttribute('placeholder', T(el.getAttribute('data-i18n-ph'))); });
  const lb=document.getElementById('langBtn');
  if(lb){ lb.textContent = (LANG_SHORT[LANG]||LANG.toUpperCase())+' ▾'; lb.title='Language / 语言'; }
  renderLangMenu();
}
/* 语言菜单：完全由 LANGS 生成，加语种后自动多一项 */
function renderLangMenu(){
  const m=document.getElementById('langMenu'); if(!m) return;
  m.innerHTML = LANGS.map(l=>'<div class="litem'+(l===LANG?' on':'')+'" onclick="setLang(\''+l+'\')">'+
      '<span class="lc">'+(LANG_SHORT[l]||l.toUpperCase())+'</span>'+
      '<span>'+(LANG_NAME[l]||l)+'</span>'+
      (l===LANG?'<span class="ck">✓</span>':'')+
    '</div>').join('');
}
function toggleLangMenu(ev){
  if(ev) ev.stopPropagation();
  const m=document.getElementById('langMenu'); if(!m) return;
  m.classList.toggle('hidden');
  if(!m.classList.contains('hidden')) renderLangMenu();
}
function closeLangMenu(){ const m=document.getElementById('langMenu'); if(m) m.classList.add('hidden'); }
function setLang(l){
  closeLangMenu();
  if(LANGS.indexOf(l)<0) return;
  LANG=l;
  try{ localStorage.setItem('dg:lang', l); }catch(e){}
  applyI18n();
  if(state.view==='game' && state.file) renderGame();
  else if(state.view==='profile') renderProfile();
  else if(state.view==='browse') renderBrowse();
  else renderHome();
}
function toggleLang(){ const i=LANGS.indexOf(LANG); setLang(LANGS[(i+1)%LANGS.length]); }

/* ============================ 存储 ============================ */
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const K = {
  users:'dg:users',          // {uid: {provider,identifier,profile,createdAt}}
  session:'dg:uid',
  fav:(uid)=>'dg:fav:'+uid,
  hist:(uid)=>'dg:hist:'+uid,
  cmts:(file)=>'dg:cmts:'+file,
};

/* ============================ 用户 ============================ */
function genId(p){ return p+'_'+Math.random().toString(36).slice(2,9); }
function getUid(){ return LS.get(K.session, null); }
function getUsers(){ return LS.get(K.users, {}); }
function getUser(uid){ const u=getUsers()[uid]; return u?u:null; }
function curUser(){ const uid=getUid(); return uid?getUser(uid):null; }
function saveUser(u){ const m=getUsers(); m[u.uid]=u; LS.set(K.users,m); }
function setSession(uid){ LS.set(K.session,uid); refreshAuthBar(); }

function ensureGuest(){
  let uid=getUid();
  if(uid && getUser(uid)) return getUser(uid);
  uid = genId('guest');
  const u={ uid, provider:'guest', identifier:uid,
    profile:{ name:T('ui.prof.guestName')+uid.slice(6,10), avatar:'🌐', bio:'' }, createdAt:Date.now() };
  saveUser(u); setSession(uid); return u;
}

function refreshAuthBar(){
  const u=curUser();
  const loginBtn=document.getElementById('loginBtn');
  const avatarBtn=document.getElementById('avatarBtn');
  const profileBtn=document.getElementById('profileBtn');
  if(u){
    loginBtn.classList.add('hidden');
    avatarBtn.classList.remove('hidden');
    document.getElementById('avatarEmoji').textContent = u.profile.avatar||'🌐';
    document.getElementById('avatarName').textContent = u.profile.name||T('ui.prof.user');
    profileBtn.textContent=T('ui.top.mine');
  } else {
    loginBtn.classList.remove('hidden');
    avatarBtn.classList.add('hidden');
    profileBtn.textContent=T('ui.top.mine');
  }
}

/* ============================ 收藏 / 记录 ============================ */
function isFav(file){
  const u=curUser(); if(!u) return false;
  return (LS.get(K.fav(u.uid),[])||[]).includes(file);
}
function toggleFav(file){
  ensureGuest();
  const u=curUser();
  const key=K.fav(u.uid); let arr=LS.get(key,[])||[];
  if(arr.includes(file)) arr=arr.filter(f=>f!==file);
  else arr.push(file);
  LS.set(key,arr);

/* 两套图分工：
   coverBg = 设计感封面（covers/），卡片默认显示 —— 游戏内截图常是一堆小字，缩到 250px 全糊
   thumbBg = 游戏内真实画面（thumbs/），只在 hover 时作为"预览"淡入          */
function gradOf(g){
  const hue=(g.hue===0||g.hue)?g.hue:168;
  return 'linear-gradient(155deg,hsl('+hue+',22%,31%),hsl('+hue+',20%,16%))';
}
function coverBg(g){
  const folder=(g.file||'').split('/')[0];
  const grad=gradOf(g);
  // cover===0 是构建期算出来的"这张图不存在"，直接退回渐变，
  // 不然浏览器还是会去发请求、控制台刷 ERR_FILE_NOT_FOUND
  if(!folder || g.cover===0) return grad;
  return 'url(\'covers/'+folder+'.webp\'),'+grad;
}
/* 分类入口卡底图：一套"同构不同色"的类目图（covers/cat-<类目>.webp），
   比拿某款游戏的封面裁成 100px 宽更整齐，也不会和下面的游戏卡撞脸 */
function catBg(cat, grad){
  const g=grad||'linear-gradient(155deg,hsl(200,20%,26%),hsl(200,18%,14%))';
  const t=(TAG_INDEX.play||[]).find(x=>x.t===cat);
  if(!cat || !t || t.img===0) return g;
  return 'url(\'covers/cat-'+encodeURIComponent(cat)+'.webp\'),'+g;
}
function thumbBg(g){
  const folder=(g.file||'').split('/')[0];
  const grad=gradOf(g);
  if(!folder || g.thumb===0) return grad;
  return 'url(\'thumbs/'+folder+'.webp\'),'+grad;
}

}

/* ---------- 横向列表翻页（隐藏滑条，一律走左右按钮 + rAF 缓动） ----------
   为什么不用 scroll-behavior:smooth：自家 rAF 才能拿到可控的 easeOutCubic 曲线、
   连点时以"目标位"为基准累加，且能在用户滚轮/触摸介入时干净地打断。 */
const RAILS=[];
function railStepPx(rail){
  const card=rail.querySelector('.gcard');
  const cs=getComputedStyle(rail);
  const gap=parseFloat(cs.columnGap||cs.gap)||16;
  const cw=card?card.getBoundingClientRect().width:240;
  const per=Math.max(1, Math.floor((rail.clientWidth+gap)/(cw+gap)));
  return per*(cw+gap);
}
const RAIL_EPS=6;   // .rail 有 2px padding，scroll-snap 会把起始 scrollLeft 顶到 2，阈值不能卡 1px
function railSync(rail){
  const max=Math.max(0, rail.scrollWidth-rail.clientWidth);
  const wrap=rail.parentNode;
  const at=rail._raf? rail._tgt : rail.scrollLeft;
  const prev=wrap.querySelector('.railbtn.prev'), next=wrap.querySelector('.railbtn.next');
  if(max<=RAIL_EPS){ wrap.classList.add('nofit'); if(prev) prev.classList.add('off'); if(next) next.classList.add('off'); return; }
  wrap.classList.remove('nofit');
  if(prev) prev.classList.toggle('off', at<=RAIL_EPS);
  if(next) next.classList.toggle('off', at>=max-RAIL_EPS);
}
function railGlide(rail, to){
  if(rail._raf){ cancelAnimationFrame(rail._raf); rail._raf=0; }
  const from=rail.scrollLeft, dist=to-from;
  rail._tgt=to;
  if(Math.abs(dist)<1){ rail.scrollLeft=to; railSync(rail); return; }
  const dur=Math.min(680, 300+Math.abs(dist)*0.6);
  const t0=performance.now();
  const snap=rail.style.scrollSnapType;
  rail.style.scrollSnapType='none';   // 动画期间关掉吸附，避免逐帧被拽回去
  const tick=(now)=>{
    const p=Math.min(1,(now-t0)/dur);
    const e=1-Math.pow(1-p,3);        // easeOutCubic
    rail.scrollLeft=from+dist*e;
    if(p<1){ rail._raf=requestAnimationFrame(tick); }
    else{
      rail._raf=0; rail.scrollLeft=to; rail.style.scrollSnapType=snap;
      rail._tgt=to; railSync(rail);
    }
  };
  rail._raf=requestAnimationFrame(tick);
  railSync(rail);
}
function railGo(rail, dir){
  const max=Math.max(0, rail.scrollWidth-rail.clientWidth);
  if(max<=RAIL_EPS) return;
  const base=rail._raf? rail._tgt : rail.scrollLeft;
  railGlide(rail, Math.max(0, Math.min(max, base + dir*railStepPx(rail))));
}
function railRelease(rail){          // 用户自己滚了：立刻交还控制权
  if(!rail._raf) return;
  cancelAnimationFrame(rail._raf); rail._raf=0;
  rail.style.scrollSnapType=''; rail._tgt=rail.scrollLeft; railSync(rail);
}
function initRails(root){
  RAILS.length=0;
  (root||document).querySelectorAll('.railwrap').forEach(w=>{
    const rail=w.querySelector('.rail');
    if(!rail) return;
    rail._tgt=rail.scrollLeft; rail._raf=rail._raf||0;
    if(!rail._bound){
      rail._bound=true;
      const prev=w.querySelector('.railbtn.prev'), next=w.querySelector('.railbtn.next');
      if(prev) prev.addEventListener('click', e=>{ e.stopPropagation(); railGo(rail,-1); });
      if(next) next.addEventListener('click', e=>{ e.stopPropagation(); railGo(rail, 1); });
      rail.addEventListener('scroll', ()=>{ if(!rail._raf) railSync(rail); }, {passive:true});
      ['wheel','pointerdown','touchstart'].forEach(ev=>
        rail.addEventListener(ev, ()=>railRelease(rail), {passive:true}));
    }
    RAILS.push(rail);
    railSync(rail);
  });
}
window.addEventListener('resize', ()=>{ RAILS.forEach(railSync); });

/* 稳定伪随机挑样：同一个 file 永远落在同一档位，刷新不会乱跳 */
function hashPicks(n, offset){
  const pool=GAMES.filter(g=>g.kind!=='衍生');
  const scored=pool.map(g=>{
    const f=g.file||''; let s=2166136261;
    for(let i=0;i<f.length;i++){ s^=f.charCodeAt(i); s=(s*16777619)>>>0; }
    return {g, s};
  }).sort((a,b)=>a.s-b.s);
  const step=Math.max(1,Math.floor(scored.length/n));
  const out=[];
  for(let i=(offset||0); i<scored.length && out.length<n; i+=step) out.push(scored[i].g);
  return out;
}

/* ---------------- Hero 轮播 ---------------- */
let heroIdx=0, heroTimer=null;
/* 轮播优先挑"视觉型"画风的游戏（有独立美术、不是纯文字面板），画面更有辨识度 */
const HERO_VISUAL=['霓虹赛博','光影粒子','卡通可爱','像素','剪纸纸感'];
function heroGames(){
  const all=GAMES.filter(g=>g.kind!=='衍生');
  const visual=all.filter(g=>{
    const art=(g.tags&&g.tags.art)||[];
    // 水墨/极简类画面偏淡、常带大量文字，当横幅背景不抓眼，排除
    if(art.indexOf('水墨国风')>=0 || art.indexOf('极简')>=0) return false;
    return art.some(a=>HERO_VISUAL.indexOf(a)>=0);
  });
  const src = (visual.length>=6 ? visual : all).slice()
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const pick=[], step=Math.max(1,Math.floor(src.length/5));
  for(let i=0;i<src.length && pick.length<5;i+=step) pick.push(src[i]);
  return pick;
}
function heroHTML(){
  const hs=heroGames();
  if(!hs.length) return '';
  let h='<div class="carousel" id="carousel">';
  hs.forEach((g,i)=>{
    h+='<div class="slide'+(i===0?' on':'')+'" data-i="'+i+'">'+
      '<div class="bg" style="background-image:'+coverBg(g)+'"></div>'+
      '<div class="veil"></div>'+

        '<div class="acts"><button class="btn-play" onclick="event.stopPropagation();goGame(\''+g.file+'\')">'+esc(T('ui.hero.play'))+'</button></div>'+
      '</div>'+
      '<div class="shot" style="background-image:'+coverBg(g)+'" onclick="goGame(\''+g.file+'\')"></div>'+
    '</div>';
  });
  h+='<div class="dots">'+hs.map((g,i)=>'<i class="'+(i===0?'on':'')+'" onclick="heroGo('+i+')"></i>').join('')+'</div>';
  h+='</div>';

}
function heroGo(i){
  const cs=document.querySelectorAll('#carousel .slide');
  if(!cs || !cs.length) return;
  const ds=document.querySelectorAll('#carousel .dots i');
  heroIdx=(i+cs.length)%cs.length;

  if(ds && ds.forEach) ds.forEach((el,k)=>el.classList.toggle('on',k===heroIdx));
}

    ).join('')+'</div>'+

      '<button class="'+(state.layout==='list'?'on':'')+'" onclick="setLayout(\'list\')">☰</button></div>'+
    '<div class="sortbox">'+esc(T('ui.sort.label'))+
    '<select onchange="setSort(this.value)">'+sortOpts.map(o=>
      '<option value="'+o.v+'"'+(state.sort===o.v?' selected':'')+'>'+o.t+'</option>').join('')+
    '</select></div></div>';
  h+=tagPanelHTML();
  if(!list.length){
    h+='<div class="empty">'+esc(state.filter==='fav'&&!hasTagFilter()?T('ui.empty.fav'):T('ui.browse.empty'))+'</div>';
  } else {
    h+='<div class="grid'+(state.layout==='list'?' list':'')+'">'+
      list.map(g=>gcardHTML(g)).join('')+'</div>';
  }
  h+='</div>';
  v.innerHTML=h;
  initRails(v);
  heroStop();
}
function setLayout(v){ state.layout=v; renderBrowse(); }
function setFilter(k){ state.filter=k; refreshList(); }
function setSort(v){ state.sort=v; refreshList(); }
function refreshList(){ if(state.view==='browse') renderBrowse(); else renderHome(); }
function onSearch(){
  const q=document.getElementById('q'); state.q=q?q.value.trim():'';
  if(state.q && state.view!=='browse'){
    state.view='browse'; state.mode='all'; state.filter='all';
    document.getElementById('view').className=''; setNav('');
    renderBrowse(); return;
  }
  refreshList();
}
function onFav(ev,file){
  ev.stopPropagation(); ev.preventDefault();
  const on=toggleFav(file);
  // 局部刷新该卡
  const card=ev.currentTarget.closest('.gcard');
  if(card){ const f=card.querySelector('.fav');
    if(f){ f.classList.toggle('on',on); f.textContent=on?'♥':'♡'; } }
  if((state.filter==='fav' && !on) || state.view==='home') refreshList();
  toast(on?T('ui.toast.faved'):T('ui.toast.unfaved'));
}

/* ============================ 游戏预览视图 ============================ */
function relatedGames(file){
  const cur=gameByFile(file); if(!cur) return GAMES.slice(0,6);
  const same=GAMES.filter(g=>g.file!==file && g.kind===cur.kind);
  const others=GAMES.filter(g=>g.file!==file && g.kind!==cur.kind);
  return same.concat(others).slice(0,6);
}
function renderGame(){
  heroStop();
  const v=document.getElementById('view');
  const g=gameByFile(state.file); if(!g){ goHome(); return; }
  const on=isFav(g.file);
  const rec=relatedGames(g.file).map(r=>
    '<div class="rec" onclick="goGame(\''+r.file+'\')">'+
      '<div class="thumb" style="background-image:'+coverBg(r)+';background-size:cover;background-position:center;"></div>'+
      '<div><div class="rt">'+esc(titleOf(r))+'</div><div class="rd">'+(r.kind==='衍生'?T('ui.kind.deriv'):T('ui.kind.game'))+' · '+(r.date||'')+'</div></div>'+
    '</div>'
  ).join('');
  v.innerHTML=
    '<div class="playbar">'+
      '<div class="back" onclick="goHome()">'+T('ui.detail.back')+'</div>'+
      '<div class="spacer"></div>'+
      '<button class="pbtn fav'+(on?' on':'')+'" id="favBtn" onclick="toggleFavFromBar(\''+g.file+'\')">'+T(on?'ui.detail.favOn':'ui.detail.favOff')+'</button>'+
      '<button class="pbtn" onclick="openNew(\''+g.file+'\')">'+T('ui.detail.newWindow')+'</button>'+
      '<button class="pbtn" onclick="goProfile()">'+T('ui.top.mine')+'</button>'+
    '</div>'+
    '<div class="stage">'+
      '<div class="leftnav">'+
        '<div class="ln-title">'+T('ui.detail.nav')+'</div>'+
        '<a class="ln active" onclick="goHome()">'+T('ui.detail.navHome')+'</a>'+
        '<a class="ln" onclick="goProfile()">'+T('ui.detail.navProfile')+'</a>'+
      '</div>'+
      '<div class="center">'+
        '<div class="frame-title">'+esc(titleOf(g))+'</div>'+
        '<div class="frame-sub">'+(g.date||'')+' · '+(g.kind==='衍生'?T('ui.kind.derivFull'):T('ui.kind.game'))+
          (tagLineOf(g)?' · '+esc(tagLineOf(g)):'')+'</div>'+
        '<div class="frame-wrap"><div class="frame-hint" id="frameHint">'+T('ui.detail.loading')+'</div>'+
          '<iframe id="gameFrame" src="'+g.file+'" onload="document.getElementById(\'frameHint\').style.display=\'none\'"></iframe>'+
          '<button class="fs-btn" onclick="toggleFullscreen()">'+T('ui.detail.fullscreen')+'</button></div>'+
        '<div class="cmt" id="cmtArea">'+renderComments(g.file)+'</div>'+
      '</div>'+
      '<div class="right"><div class="rh">'+T('ui.detail.related')+'</div>'+rec+'</div>'+
    '</div>';
  // 记录游玩已在 goGame 完成
}
function toggleFavFromBar(file){
  const on=toggleFav(file);
  const b=document.getElementById('favBtn'); if(b){ b.classList.toggle('on',on); b.textContent=T(on?'ui.detail.favOn':'ui.detail.favOff'); }
  toast(on?T('ui.toast.faved'):T('ui.toast.unfaved'));
}
function openNew(file){ window.open(file,'_blank'); }
function toggleFullscreen(){
  const wrap=document.querySelector('.frame-wrap');
  if(!wrap) return;
  const fsEl=document.fullscreenElement||document.webkitFullscreenElement;
  if(fsEl){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
  else { (wrap.requestFullscreen||wrap.webkitRequestFullscreen).call(wrap); }
}

/* ============================ 评论 ============================ */
function renderComments(file){
  const list=LS.get(K.cmts(file),[])||[];
  let html='<h3>'+T('ui.cmt.title')+' <span class="cnt">'+list.length+'</span></h3>';
  // 输入框（以当前用户身份）
  const u=curUser()||ensureGuest();
  html+='<div class="cmt-box"><span class="av">'+(u.profile.avatar||'🌐')+'</span>'+
    '<div class="grow"><textarea id="cmtInput" placeholder="'+esc(T('ui.cmt.ph',{name:u.profile.name||T('ui.prov.guest')}))+'"></textarea>'+
    '<div class="row"><button class="pbtn primary" onclick="postComment(\''+file+'\')">'+T('ui.cmt.post')+'</button></div></div></div>';
  if(list.length===0){
    html+='<div class="empty" style="padding:30px 0">'+T('ui.cmt.empty')+'</div>';
  } else {
    html+='<div class="cmt-list">'+list.map(c=>
      '<div class="item"><span class="av">'+(c.avatar||'🌐')+'</span><div class="body">'+
        '<div class="nm">'+esc(c.name)+
          (c.provider&&c.provider!=='guest'?'<span class="tag">'+(provLabel(c.provider))+'</span>':'<span class="tag">'+T('ui.prov.guest')+'</span>')+
        '</div>'+
        '<div class="tx">'+esc(c.text)+'</div>'+
        '<div class="ft"><span>'+fmtDate(c.ts)+'</span>'+
          '<span class="like'+(c.liked?' on':'')+'" onclick="likeComment(\''+file+'\','+c.id+')">♥ '+(c.likes||0)+'</span></div>'+
      '</div></div>'
    ).join('')+'</div>';
  }
  return html;
}
function provLabel(p){ return T('ui.prov.'+p)||p; }
function postComment(file){
  const u=curUser()||ensureGuest();
  const ta=document.getElementById('cmtInput'); const text=ta.value.trim();
  if(!text){ toast(T('ui.cmt.needText')); return; }
  const list=LS.get(K.cmts(file),[])||[];
  list.unshift({ id:Date.now()+Math.floor(Math.random()*1000), name:u.profile.name||T('ui.prov.guest'),
    avatar:u.profile.avatar||'🌐', provider:u.provider, text, ts:Date.now(), likes:0, liked:false });
  LS.set(K.cmts(file),list);
  // 重新渲染评论区
  const area=document.getElementById('cmtArea'); if(area) area.innerHTML=renderComments(file);
  toast(T('ui.cmt.posted'));
}
function likeComment(file,id){
  const list=LS.get(K.cmts(file),[])||[];
  const c=list.find(x=>x.id===id); if(!c) return;
  c.liked=!c.liked; c.likes=(c.likes||0)+(c.liked?1:-1); if(c.likes<0)c.likes=0;
  LS.set(K.cmts(file),list);
  const area=document.getElementById('cmtArea'); if(area) area.innerHTML=renderComments(file);
}

/* ============================ 个人主页 ============================ */
const AVATARS=['🌐','🍑','🚀','🌟','🔥','🌈','🐱','🐼','🦊','🌸','⚡','🎮','🍀','🌙'];
function renderProfile(){
  heroStop();
  const v=document.getElementById('view');
  const u=curUser()||ensureGuest();
  const isGuest=u.provider==='guest';
  const favs=favList().map(f=>gameByFile(f)).filter(Boolean);
  const hist=(LS.get(K.hist(u.uid),[])||[]).map(h=>gameByFile(h.file)).filter(Boolean);
  let html='<div class="profile">';
  // 卡片
  html+='<div class="pcard"><span class="av lg">'+(u.profile.avatar||'🌐')+'</span>'+
    '<div style="flex:1"><div style="font-size:20px;letter-spacing:2px">'+esc(u.profile.name||T('ui.prov.guest'))+'</div>'+
    '<div style="color:var(--mut);font-size:12px;margin-top:6px">'+
      (isGuest?T('ui.prof.guestHint'):T('ui.prof.signedIn',{provider:provLabel(u.provider)})+' '+(u.identifier||''))+'</div>'+
    (isGuest?'<button class="tbtn primary" style="margin-top:14px" onclick="openAuth()">'+T('ui.prof.upgrade')+'</button>':'')+
    '</div></div>';
  // 资料编辑
  html+='<div class="psec"><h3>'+T('ui.prof.edit')+'</h3>'+
    '<div class="form-row"><label>'+T('ui.prof.nick')+'</label><input id="pfName" value="'+esc(u.profile.name||'')+'"></div>'+
    '<div class="form-row"><label>'+T('ui.prof.bio')+'</label><textarea id="pfBio" rows="2">'+esc(u.profile.bio||'')+'</textarea></div>'+
    '<div class="form-row"><label>'+T('ui.prof.avatar')+'</label><div class="avpick" id="avpick">'+
      AVATARS.map(a=>'<div class="opt'+(a===(u.profile.avatar||'🌐')?' on':'')+'" data-a="'+a+'" onclick="pickAvatar(\''+a+'\')">'+a+'</div>').join('')+
    '</div></div>'+
    '<div style="text-align:right"><button class="tbtn primary" onclick="saveProfile()">'+T('ui.prof.save')+'</button></div>'+
  '</div>';
  // 游玩记录
  html+='<div class="psec"><h3>'+T('ui.prof.history')+' <span class="cnt" style="color:var(--mut)">'+hist.length+'</span></h3>'+
    (hist.length?hist.map(g=>listItem(g)).join(''):'<div class="empty" style="padding:24px 0">'+T('ui.prof.historyEmpty')+'</div>')+
  '</div>';
  // 收藏
  html+='<div class="psec"><h3>'+T('ui.prof.favs')+' <span class="cnt" style="color:var(--mut)">'+favs.length+'</span></h3>'+
    (favs.length?favs.map(g=>listItem(g,true)).join(''):'<div class="empty" style="padding:24px 0">'+T('ui.prof.favsEmpty')+'</div>')+
  '</div>';
  html+='</div>';
  v.innerHTML=html;
}
function listItem(g,withFav){
  return '<div class="list-item" onclick="goGame(\''+g.file+'\')">'+
    '<div class="thumb" style="background-image:'+coverBg(g)+';background-size:cover;background-position:center;"></div>'+
    '<div><div class="li-title">'+esc(titleOf(g))+'</div><div class="li-sub">'+(g.kind==='衍生'?T('ui.kind.deriv'):T('ui.kind.game'))+' · '+(g.date||'')+'</div></div>'+
    (withFav?'<div class="li-fav">♥</div>':'')+
  '</div>';
}
function pickAvatar(a){
  document.querySelectorAll('#avpick .opt').forEach(o=>o.classList.toggle('on',o.dataset.a===a));
}
function saveProfile(){
  const u=curUser()||ensureGuest();
  u.profile.name=document.getElementById('pfName').value.trim()||u.profile.name;
  u.profile.bio=document.getElementById('pfBio').value.trim();
  const sel=document.querySelector('#avpick .opt.on'); if(sel) u.profile.avatar=sel.dataset.a;
  saveUser(u); refreshAuthBar(); toast(T('ui.prof.saved'));
}

/* ============================ 登录 / 注册 ============================ */
let authTab='guest';
let mockCode=null;
function openAuth(){ authTab='guest'; syncAuthTabs(); renderAuthBody();
  document.getElementById('authModal').classList.remove('hidden'); }
function closeAuth(){ document.getElementById('authModal').classList.add('hidden'); document.getElementById('authErr').textContent=''; }
function switchAuth(t){ authTab=t; syncAuthTabs(); renderAuthBody(); }
function syncAuthTabs(){ document.querySelectorAll('#authTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.t===authTab)); }
function setErr(m){ document.getElementById('authErr').textContent=m; }

function findUser(provider,identifier){ const m=getUsers();
  for(const k in m){ if(m[k].provider===provider && m[k].identifier===identifier) return m[k]; } return null; }
function finishLogin(u){ saveUser(u); setSession(u.uid); closeAuth(); toast(T('ui.auth.welcome',{name:u.profile.name})); }

function renderAuthBody(){
  const b=document.getElementById('authBody'); setErr('');
  if(authTab==='guest'){
    b.innerHTML='<button class="prov" onclick="doGuest()"><span class="ic">🌐</span>'+T('ui.auth.guestBtn')+'</button>'+
      '<div style="color:var(--mut);font-size:12px;line-height:1.7;margin-top:8px">'+T('ui.auth.guestHint2')+'</div>';
  } else if(authTab==='wechat'){
    b.innerHTML='<button class="prov" onclick="doWechat()"><span class="ic" style="background:rgba(7,193,96,.2)">💬</span>'+T('ui.auth.wechatBtn')+'</button>'+
      '<div style="color:var(--mut);font-size:12px;line-height:1.7;margin-top:8px">'+T('ui.auth.wechatHint')+'</div>';
  } else {
    const isPhone=authTab==='phone';
    const label=isPhone?T('ui.auth.phone'):T('ui.auth.email');
    const ph=isPhone?'13800000000':'you@example.com';
    b.innerHTML=
      '<div class="field"><input id="authId" placeholder="'+ph+'"></div>'+
      '<div class="field"><div class="row"><input id="authCode" placeholder="'+T('ui.auth.codePh')+'"><button class="codebtn" id="codeBtn" onclick="sendCode()">'+T('ui.auth.sendCode')+'</button></div></div>'+
      '<button class="prov" onclick="doCodeLogin()"><span class="ic" style="background:rgba(255,106,61,.18)">'+(isPhone?'📱':'✉️')+'</span>'+T(isPhone?'ui.auth.loginByPhone':'ui.auth.loginByEmail')+'</button>'+
      '<div style="color:var(--mut);font-size:12px;line-height:1.7;margin-top:8px">'+T('ui.auth.codeHint')+'</div>';
  }
}
function sendCode(){
  const id=document.getElementById('authId').value.trim();
  if(!id){ setErr(T(authTab==='phone'?'ui.auth.needId.phone':'ui.auth.needId.email')); return; }
  mockCode=String(Math.floor(100000+Math.random()*900000));
  toast(T('ui.auth.simCode',{code:mockCode}));
  const btn=document.getElementById('codeBtn'); if(btn){ btn.disabled=true; let n=30;
    btn.textContent=n+'s';
    const t=setInterval(()=>{ n--; if(n<=0){ clearInterval(t); btn.disabled=false; btn.textContent=T('ui.auth.sendCode'); } else btn.textContent=n+'s'; },1000); }
}
function doCodeLogin(){
  const id=document.getElementById('authId').value.trim();
  const code=document.getElementById('authCode').value.trim();
  if(!id){ setErr(T(authTab==='phone'?'ui.auth.needId.phone':'ui.auth.needId.email')); return; }
  if(!code){ setErr(T('ui.auth.needCode')); return; }
  if(!mockCode || code!==mockCode){ setErr(T('ui.auth.badCode',{code:mockCode})); return; }
  const provider=authTab;
  let u=findUser(provider,id);
  if(!u){
    u={ uid:genId(provider), provider, identifier:id,
      profile:{ name:(provider==='phone'?T('ui.prof.user')+id.slice(-4):id.split('@')[0]), avatar:'🍑', bio:'' }, createdAt:Date.now() };
  }
  finishLogin(u);
}
function doWechat(){
  const fakeOpenid='wx_'+Math.random().toString(36).slice(2,12);
  let u=findUser('wechat',fakeOpenid);
  if(!u) u={ uid:genId('wechat'), provider:'wechat', identifier:fakeOpenid,
    profile:{ name:T('ui.auth.wechatUser')+fakeOpenid.slice(3,7), avatar:'💬', bio:'' }, createdAt:Date.now() };
  finishLogin(u);
}
function doGuest(){ const u=ensureGuest(); closeAuth(); toast(T('ui.auth.guestWelcome')); }

/* ============================ 启动 ============================ */
/* 支持深链，方便分享：?cat=解谜 → 分类浏览页；?play=001-karesansui/index.html → 直接开玩 */
function boot(){
  applyI18n();       // 先应用语言：<title> / 顶栏 / placeholder / 语言菜单
  refreshAuthBar();  // 再刷登录态（昵称是用户数据，不能被语言覆盖）
  try{
    const p=new URLSearchParams(location.search||'');
    const play=p.get('play'), cat=p.get('cat'), br=p.get('browse');
    if(play && gameByFile(play)){ goGame(play); return; }
    if(cat){ goBrowse('cat', cat); return; }
    if(br){ goBrowse(br); return; }
  }catch(e){}
  renderHome();
}
boot();
